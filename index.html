<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Layers</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        padding: 24px;
        align-items: start;
        justify-items: start;
        background: #f4faff;
        font-family: "Segoe UI", sans-serif;
      }

      .form-card {
        display: flex;
        flex-direction: column;
        width: min(420px, 100%);
        height: 402px;
        padding: 40px;
        overflow: visible;
        border: 1px solid #dcd7d2;
        border-radius: 16px;
        background: #fff;
        color: #24211e;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 600;
        line-height: 33.6px;
        letter-spacing: -0.8px;
      }

      form {
        width: 100%;
        margin-top: 32px;
      }

      .field {
        display: grid;
        grid-template-rows: 21px 50px;
        gap: 8px;
      }

      .field + .field {
        margin-top: 24px;
      }

      label {
        font-size: 14px;
        line-height: 21px;
      }

      input {
        width: 100%;
        height: 50px;
        padding: 0 14px;
        border: 1px solid #dcd7d2;
        border-radius: 7px;
        background: #fff;
        color: #24211e;
        font: inherit;
        font-size: 16px;
      }

      input::placeholder {
        color: #7c7671;
        opacity: 1;
      }

      input:focus-visible {
        outline: 2px solid #24211e;
        outline-offset: 2px;
      }

      button {
        width: 100%;
        height: 48px;
        margin-top: 24px;
        padding: 0 16px;
        border: 0;
        border-radius: 8px;
        background: #ff8426;
        color: #17120e;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #f47818;
      }

      button:active {
        background: #e96b0a;
      }

      button:focus-visible {
        outline: 2px solid #24211e;
        outline-offset: 2px;
      }

      @media (max-width: 467px) {
        .form-card {
          height: auto;
          min-height: 402px;
          padding: 32px 24px;
        }
      }
    </style>
  </head>
  <body>
    <section class="form-card" aria-labelledby="form-title">
      <h1 id="form-title">TOMADO DIRECTAMENTE DE LOCAL</h1>
      <form>
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Tu nombre" autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="nombre@ejemplo.com"
            autocomplete="email"
          />
        </div>
        <button type="button">Crear</button>
      </form>
    </section>
  </body>
</html>
