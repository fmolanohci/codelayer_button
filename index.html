<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Layers</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background: #f4faff;
        font-family: "Segoe UI", sans-serif;
      }

      button {
        width: fit-content;
        max-width: 100%;
        min-height: 56px;
        padding: 16px 36px;
        border: 1px solid #77caff;
        border-radius: 14px;
        background: #8bd3ff;
        color: #073d5d;
        font: inherit;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.2px;
        box-shadow: 0 8px 24px rgb(30 139 205 / 14%);
        cursor: pointer;
      }

      button:hover {
        background: #70c8ff;
      }

      button:active {
        background: #55bbfa;
      }

      button:focus-visible {
        outline: 3px solid #087ab8;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <button type="button">EXAMPLE</button>
  </body>
</html>
